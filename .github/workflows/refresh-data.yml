# Keeps the listings fresh: every 3 hours it reads each portal's sitemap, fetches only
# new or changed listings, rebuilds the dataset and model, and commits the result to
# main. The "Publish web app" workflow then republishes the site (see its workflow_run
# trigger: pushes made with GITHUB_TOKEN do not start other workflows on their own).
name: Refresh listings

on:
  schedule:
    - cron: "23 */3 * * *"      # sitemap portals (Basobaas, Nepal Property Bazaar, Gharghaderi)
    - cron: "47 1 * * *"        # once a day also Hamrobazaar (06:32 Nepal time)
  workflow_dispatch:
    inputs:
      hamrobazaar:
        description: "Also crawl Hamrobazaar (slower, uses a headless browser)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-listings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/requirements.txt
      - run: pip install -r data/requirements.txt
      - name: Set up Playwright for Hamrobazaar
        if: github.event.schedule == '47 1 * * *' || inputs.hamrobazaar
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Crawl, clean, retrain, export
        working-directory: data
        env:
          HB: ${{ (github.event.schedule == '47 1 * * *' || inputs.hamrobazaar) && '--hamrobazaar' || '' }}
        run: python update.py --budget-min 25 $HB
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/property_listings.csv data/geo_places.json web/model.json web/listings.json
          if git diff --cached --quiet; then echo "No new listings"; exit 0; fi
          N=$(python3 -c "import json;print(json.load(open('web/model.json'))['n'])")
          git commit -q -m "Refresh listings: ${N} in the model"
          git push origin HEAD:main
